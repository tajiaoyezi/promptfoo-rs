name: 🧩 Compatibility Report · 兼容性差异
description: 报告 promptfoo-rs 与冻结基线 promptfoo@0.121.15 的行为差异
title: "[COMPAT] "
labels: ["compatibility", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        用于报告 promptfoo-rs 与 **冻结兼容基线 `promptfoo@0.121.15`** 的行为差异。
        - 基线为何冻结：见 [ADR-012](https://github.com/tajiaoyezi/promptfoo-rs/blob/master/docs/decisions/adr-012-product-independence-baseline-freeze.md)。
        - **仅存在于 0.121.15 之后** upstream 版本的特性差异属于 out of scope（项目不追 upstream drift）。
        - 兼容分级与现有边界：见 [docs/compatibility/matrix.md](https://github.com/tajiaoyezi/promptfoo-rs/blob/master/docs/compatibility/matrix.md)。报告前请确认该差异未被矩阵登记为已知 blocker / unsupported。

  - type: input
    id: feature
    attributes:
      label: 涉及的 promptfoo 能力 / 命令 / 字段
      placeholder: "例：assert type=javascript / providers[].config.headers / promptfoo eval --repeat"
    validations:
      required: true

  - type: textarea
    id: upstream-behavior
    attributes:
      label: promptfoo@0.121.15 的行为（期望）
      description: 在冻结基线版本上 promptfoo 的实际表现；如有文档 / 源码位置请附链接
    validations:
      required: true

  - type: textarea
    id: rs-behavior
    attributes:
      label: promptfoo-rs 的行为（实际）
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: 最小复现（脱敏后的 config + 命令 + 输出）
      value: |
        ```yaml
        # promptfooconfig.yaml

        ```
        命令：`promptfoo eval -c promptfooconfig.yaml ...`
    validations:
      required: true

  - type: dropdown
    id: level
    attributes:
      label: 你认为的兼容分级（自评，最终由维护者判定）
      options:
        - P0（核心行为；应有 golden-diff / fixture 证据）
        - P1（快照 / 协议契约级）
        - P2（unsupported / later / bridge-backed）
        - 不确定
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: promptfoo-rs 版本 / 来源
      placeholder: "promptfoo 0.1.3 · GitHub Releases / source @SHA"
    validations:
      required: true

  - type: checkboxes
    id: pre-submit
    attributes:
      label: 提交前检查
      options:
        - label: 该差异在 promptfoo@0.121.15（冻结基线）上确实存在，而非仅在更新的 upstream 版本
          required: true
        - label: 我已检查 docs/compatibility/matrix.md，该差异未被登记为已知 blocker / unsupported
          required: true
        - label: 复现材料已脱敏（无 API key / token / 凭据）
          required: true
