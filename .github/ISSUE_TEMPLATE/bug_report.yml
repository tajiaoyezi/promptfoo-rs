name: 🐛 Bug Report · 缺陷报告
description: 报告一个可复现的 bug（CLI / eval / 输出 / viewer / 桥接等）
title: "[BUG] "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        感谢提交 bug report。**开始前**：
        - 搜索 [现有 issues](https://github.com/tajiaoyezi/promptfoo-rs/issues?q=is%3Aissue) 避免重复
        - 安全漏洞**不要**开公开 issue → 走 [Security Advisory](https://github.com/tajiaoyezi/promptfoo-rs/security/advisories/new)
        - 与 upstream promptfoo 的**兼容性差异**请改用 **Compatibility Report** 模板
        - 贴 log / 配置前请**脱敏**：移除 provider API key、token、账号凭据

  - type: input
    id: summary
    attributes:
      label: 一句话概括
      description: '尽量具体。例："promptfoo eval 在 assert type=contains 且 value 含中文时返回 pass=false"'
    validations:
      required: true

  - type: textarea
    id: reproduction
    attributes:
      label: 复现步骤（Reproduction Steps）
      description: 含最小 promptfooconfig.yaml 与运行命令；越具体越好
      value: |
        1. 配置（脱敏后的 promptfooconfig.yaml）：
           ```yaml

           ```
        2. 运行命令：`promptfoo eval -c promptfooconfig.yaml ...`
        3.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 期望行为
    validations:
      required: true

  - type: textarea
    id: actual
    attributes:
      label: 实际行为（含报错 / 退出码 / 脱敏后的日志）
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: 影响范围
      options:
        - CLI / 参数解析
        - 配置加载（promptfooconfig.yaml / env / prompt 文件）
        - Eval runner / 缓存 / resume / 调度
        - Provider 执行
        - Assertion 判定
        - 输出格式（JSON / JSONL / JUnit / SARIF / CSV / HTML）
        - 本地 viewer
        - npm wrapper / Node API
        - Script bridge（JS / TS / Python / Shell / Ruby）
        - 构建 / 安装 / CI
        - 文档 / spec 不一致
        - 其他
    validations:
      required: true

  - type: input
    id: version
    attributes:
      label: 版本 / 来源
      description: '`promptfoo --version` 输出，及安装方式（GitHub Releases 资产 / 源码构建 commit SHA）'
      placeholder: "promptfoo 0.1.3 · GitHub Releases x86_64-linux · 或 source @70176a6"
    validations:
      required: true

  - type: input
    id: os
    attributes:
      label: 操作系统 / 架构
      placeholder: "Windows 11 x64 / macOS 15 arm64 / Ubuntu 24.04 x64"
    validations:
      required: true

  - type: textarea
    id: additional
    attributes:
      label: 补充信息（可选）
      description: 相关 PR / commit / 截图 / 完整脱敏日志
    validations:
      required: false

  - type: checkboxes
    id: pre-submit
    attributes:
      label: 提交前检查
      options:
        - label: 我已搜索现有 issues，无重复
          required: true
        - label: 这不是安全漏洞（安全漏洞走 Security Advisory）
          required: true
        - label: 我已从配置 / 日志中移除所有 secret（API key、token、凭据）
          required: true
