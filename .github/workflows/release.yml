name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
      - name: Prepare pnpm
        run: corepack enable && corepack prepare pnpm@10.33.0 --activate
      - name: S2V verification
        run: |
          source docs/s2v/scripts/lib/preflight.sh
          source docs/s2v/scripts/lib/verify.sh
          # runtime-smoke before unit-test: cold CI needs target/release-gates artifacts first
          s2v_verify_full "install lint typecheck runtime-smoke unit-test integration e2e coverage build"
      - name: Viewer package smoke
        run: |
          cd viewer
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: npm wrapper package smoke
        run: |
          cd npm
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Full compatibility release gate
        run: |
          mkdir -p compatibility/artifacts/release-gate
          cargo test --test p0_fixture_corpus --test executable_upstream_rs_runner --test golden_diff_ci_release_gate
      - name: Assert real upstream corpus gate
        run: |
          test -f target/release-gates/real-upstream-corpus/index.json
          test -f target/release-gates/real-upstream-corpus/summary.json
      - name: Build release binary
        run: cargo build --workspace --release
      - name: Release installability dry-run
        run: PROMPTFOO_RS_SKIP_RUNTIME_SMOKE=1 bash scripts/release/installability.sh
      - name: Upload compatibility release gate artifacts
        uses: actions/upload-artifact@v7
        with:
          name: compatibility-release-gate
          path: compatibility/artifacts/release-gate
      - name: Upload release hardening artifacts
        uses: actions/upload-artifact@v7
        with:
          name: release-hardening-gates
          path: target/release-gates
      - name: Compatibility release gate reminder
        run: |
          echo "Stable publishing requires the compatibility release gate to be Ready."
          echo "Blocked gates may only publish prerelease or nightly artifacts."

  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
          - os: windows-latest
            target: x86_64-pc-windows-msvc
          - os: macos-latest
            target: aarch64-apple-darwin
          - os: macos-latest
            target: x86_64-apple-darwin
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
      - name: Package GitHub Release archive
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
        run: bash scripts/release/package-github-release.sh
      - name: Upload release archive
        uses: actions/upload-artifact@v7
        with:
          name: github-release-${{ matrix.target }}
          path: |
            target/github-release-dist/*.tar.gz
            target/github-release-dist/*.zip

  publish:
    needs: [verify, build]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - name: Download release archives
        uses: actions/download-artifact@v8
        with:
          pattern: github-release-*
          merge-multiple: true
          path: dist
      - name: Write combined SHA256SUMS
        run: |
          cd dist
          shopt -s nullglob
          archives=( *.tar.gz *.zip )
          if [ "${#archives[@]}" -eq 0 ]; then
            echo "no release archives found in dist/" >&2
            exit 1
          fi
          sha256sum "${archives[@]}" > SHA256SUMS
          cat SHA256SUMS
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          body_path: docs/release-notes/${{ github.ref_name }}.md
          generate_release_notes: false
          fail_on_unmatched_files: true
      - name: Publication evidence backfill reminder
        run: |
          echo "After release upload completes, run:"
          echo "  node scripts/release/backfill-github-release-evidence.mjs --artifact-url <release-asset-url> --digest sha256:<hash> --timestamp <iso8601>"
          echo "Then commit docs/compatibility/publication-evidence.json and open a PR."
