name: release

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - name: S2V verification
        run: |
          source docs/s2v/scripts/lib/preflight.sh
          source docs/s2v/scripts/lib/verify.sh
          s2v_verify_full "install lint typecheck unit-test integration e2e coverage build runtime-smoke"
      - name: Viewer package smoke
        run: |
          corepack enable
          cd viewer
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: npm wrapper package smoke
        run: |
          corepack enable
          cd npm
          pnpm install --frozen-lockfile
          pnpm typecheck
          pnpm test
          pnpm build
      - name: Full compatibility release gate
        run: |
          mkdir -p compatibility/artifacts/release-gate
          cargo test --test p0_fixture_corpus --test executable_upstream_rs_runner --test golden_diff_ci_release_gate
      - name: Assert real upstream corpus gate
        run: |
          test -f target/release-gates/real-upstream-corpus/index.json
          test -f target/release-gates/real-upstream-corpus/summary.json
      - name: Build release binary
        run: cargo build --workspace --release
      - name: Release installability dry-run
        run: PROMPTFOO_RS_SKIP_RUNTIME_SMOKE=1 bash scripts/release/installability.sh
      - name: Upload compatibility release gate artifacts
        uses: actions/upload-artifact@v4
        with:
          name: compatibility-release-gate
          path: compatibility/artifacts/release-gate
      - name: Upload release hardening artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-hardening-gates
          path: target/release-gates
      - name: Compatibility release gate reminder
        run: |
          echo "Stable publishing requires the compatibility release gate to be Ready."
          echo "Blocked gates may only publish prerelease or nightly artifacts."
