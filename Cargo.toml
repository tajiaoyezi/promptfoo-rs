[package]
name = "promptfoo-rs"
version = "0.1.3"
edition = "2021"
license = "MIT"

[lib]
name = "promptfoo_rs"
path = "src/lib.rs"

[[bin]]
name = "promptfoo-rs"
path = "src/main.rs"

[[bin]]
name = "promptfoo"
path = "src/bin/promptfoo.rs"

[dependencies]
clap = { version = "4.5.53", features = ["derive"] }
csv = "1"
quick-xml = "0.38"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
regex = "1"
serde = { version = "1.0.228", features = ["derive"] }
serde_json = "1.0.145"
serde_yaml = "0.9.34"
sha2 = "0.11"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio", "sqlite"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread"] }
tracing = "0.1"
jsonschema = "0.17"
